<dialog class="language-modal" id="language-dialog" data-language-modal aria-labelledby="language-title">
  <div class="language-modal__panel">
    <button class="language-modal__close" type="button" data-language-close data-i18n-aria="close" aria-label="{{t:close}}">×</button>
    <h2 id="language-title" data-i18n="chooseLanguage">{{t:chooseLanguage}}</h2>
    <p data-i18n="languageIntro">{{t:languageIntro}}</p>
    <div class="language-options">{{languages}}</div>
  </div>
</dialog>
