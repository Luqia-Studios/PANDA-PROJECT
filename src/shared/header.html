<a class="skip-link" href="{{skipTarget}}" data-i18n="skipContent">{{t:skipContent}}</a>
<header class="quick-nav" data-site-header>
  <a class="site-brand" href="/" data-home-brand data-i18n-aria="homeBrand" aria-label="{{t:homeBrand}}"{{brandCurrent}}>Panda <span>Project</span></a>
  <nav class="site-navigation" data-primary-navigation data-i18n-aria="primaryNavigation" aria-label="{{t:primaryNavigation}}">{{navigation}}</nav>
  <div class="header-actions">
    <div class="social-links" data-i18n-aria="socialChannels" aria-label="{{t:socialChannels}}">{{socials}}</div>
    <button class="language-toggle" type="button" data-language-toggle data-i18n-aria="chooseLanguage" aria-label="{{t:chooseLanguage}}" aria-haspopup="dialog" aria-controls="language-dialog" aria-expanded="false">{{t:language}} <strong>IT</strong></button>
    <button class="menu-button" id="menu-button" data-menu-open type="button" aria-expanded="false" aria-haspopup="dialog" aria-controls="site-menu" data-i18n="menu">{{t:menu}} <span aria-hidden="true">+</span></button>
  </div>
  {{back}}
</header>
