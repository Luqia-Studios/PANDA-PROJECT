    <script>
      const pandaModel = document.querySelector("#panda-model");
      const pandaModelShell = document.querySelector("#panda-model-shell");
      const vehicleTrack = document.querySelector("#vehicle-swiper-track");
      const vehicleDots = [...document.querySelectorAll(".vehicle-swiper__dot")];
      const previousVehicle = document.querySelector("#vehicle-previous");
      const nextVehicle = document.querySelector("#vehicle-next");
      pandaModel?.addEventListener("error", () => pandaModelShell?.classList.add("has-error"));
      const setModelFraming = () => {
        if (!pandaModel) return;
        const distance = window.matchMedia("(max-width: 680px)").matches ? "108%" : "88%";
        pandaModel.setAttribute("camera-orbit", `36deg 72deg ${distance}`);
        pandaModel.setAttribute("min-camera-orbit", `auto auto ${distance}`);
        pandaModel.setAttribute("max-camera-orbit", `auto auto ${distance}`);
      };
      pandaModel?.addEventListener("load", setModelFraming);
      window.matchMedia("(max-width: 680px)").addEventListener("change", setModelFraming);
      setModelFraming();
      const setActiveVehicle = (index) => {
        const slide = vehicleTrack?.children[index];
        if (!slide) return;
        vehicleTrack.scrollTo({ left: slide.offsetLeft, behavior: "smooth" });
        vehicleDots.forEach((dot, dotIndex) => {
          const active = dotIndex === index;
          dot.classList.toggle("is-active", active);
          dot.setAttribute("aria-selected", String(active));
        });
      };
      vehicleDots.forEach((dot, index) => dot.addEventListener("click", () => setActiveVehicle(index)));
      const moveVehicle = (direction) => {
        const activeIndex = vehicleDots.findIndex((dot) => dot.getAttribute("aria-selected") === "true");
        setActiveVehicle((activeIndex + direction + vehicleDots.length) % vehicleDots.length);
      };
      previousVehicle?.addEventListener("click", () => moveVehicle(-1));
      nextVehicle?.addEventListener("click", () => moveVehicle(1));
      vehicleTrack?.addEventListener("scroll", () => {
        const index = Math.round(vehicleTrack.scrollLeft / vehicleTrack.clientWidth);
        vehicleDots.forEach((dot, dotIndex) => {
          const active = dotIndex === index;
          dot.classList.toggle("is-active", active);
          dot.setAttribute("aria-selected", String(active));
        });
      }, { passive: true });
      let dragStartX = null;
      let dragStartScroll = 0;
      vehicleTrack?.addEventListener("pointerdown", (event) => {
        if (event.target.closest("model-viewer, a, button")) return;
        dragStartX = event.clientX;
        dragStartScroll = vehicleTrack.scrollLeft;
        vehicleTrack.setPointerCapture(event.pointerId);
      });
      vehicleTrack?.addEventListener("pointermove", (event) => {
        if (dragStartX === null) return;
        const distance = event.clientX - dragStartX;
        if (Math.abs(distance) > 4) {
          event.preventDefault();
          vehicleTrack.scrollLeft = dragStartScroll - distance;
        }
      });
      const stopVehicleDrag = () => { dragStartX = null; };
      vehicleTrack?.addEventListener("pointerup", stopVehicleDrag);
      vehicleTrack?.addEventListener("pointercancel", stopVehicleDrag);
    </script>
    <script type="module">
      import { DotLottie } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web/+esm";

      const buildGearsCanvas = document.querySelector("#build-gears-animation");
      if (buildGearsCanvas) {
        new DotLottie({
          canvas: buildGearsCanvas,
          src: "/public/assets/animations/gears-animation.lottie",
          autoplay: true,
          loop: true,
          renderConfig: { autoResize: true }
        });
      }
