  <body>
    <header class="quick-nav">
      <div class="social-links" aria-label="Canali Panda Project"></div>
      <div class="header-actions"><button class="menu-button" id="menu-button" type="button" aria-expanded="false" aria-controls="site-menu" data-i18n="menu">Menu <span aria-hidden="true">+</span></button></div>
    </header>
    <main class="project-gallery" aria-labelledby="gallery-title">
      <p class="project-gallery__eyebrow">Pandanna</p>

      <p class="project-gallery__hint" aria-hidden="true" data-i18n="galleryHint">Trascina per esplorare</p>
      <div class="project-gallery__rail" tabindex="0" data-i18n-aria="galleryRail"></div>
      <div class="project-gallery__footer">
        <p class="project-gallery__counter" aria-live="polite"><span>01</span> / <b>18</b></p>
