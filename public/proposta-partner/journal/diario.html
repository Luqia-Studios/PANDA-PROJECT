    <script src="../i18n.js?v=20260916-2"></script><script src="./content.js"></script><script>const entries = document.querySelector("#journal-entries"); window.PANDA_JOURNAL.entries.forEach((entry) => { const article = document.createElement("article"); article.className = "journal-entry"; const details = document.createElement("details"); const summary = document.createElement("summary"); summary.append(entry.title, Object.assign(document.createElement("span"), { textContent: "+" })); const body = document.createElement("div"); body.className = "journal-entry__body"; entry.paragraphs.forEach((paragraph) => { const text = document.createElement("p"); text.textContent = paragraph; body.append(text); }); details.append(summary, body); article.append(details); entries.append(article); });</script>
